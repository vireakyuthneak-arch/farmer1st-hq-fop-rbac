# Render Profiles -> Rendered Manifests, then hand off to fop-appstore.
#
# On merge to main: validate the spec, run the deterministic renderer (golden
# hash test first — a hash drift would make the daemon reject every manifest),
# then fire repository_dispatch at farmer1st-common/fop-appstore. Per ADR-0023
# this repo holds NO appstore write credential — the appstore's own publish
# workflow validates the dispatch against publishers.yml and commits the
# manifests. The daemon polls the appstore, never this repo.
#
# Required secret: APPSTORE_DISPATCH_TOKEN — fine-grained PAT on
# farmer1st-common/fop-appstore with contents:write (dispatch only).
# Until it exists, the render still runs and uploads an artifact; the
# dispatch step reports itself skipped.
name: render-manifests

on:
  push:
    branches: [main]
    paths: ["profiles/**", "render/**", "schema/**", "scripts/validate.py"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-manifests # serialize publishes (ADR-0023)
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt

      - name: Validate Profiles
        run: python3 scripts/validate.py validate

      - name: Golden hash + determinism tests
        run: python3 render/test_render.py

      - name: Fetch previous index (manifest version carry-forward)
        env:
          TOKEN: ${{ secrets.APPSTORE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::no token — first-publish semantics (all versions start at 1)"
            exit 0
          fi
          # Discriminate on HTTP status: only a real 404 means first publish.
          # A transient 401/403/429/5xx must FAIL the run — silently resetting
          # every manifest version to 1 would regress the published index.
          # (Caveat: GitHub also 404s when the PAT lacks repo access, so a
          # mis-scoped token still reads as first publish.)
          code=$(curl -sS --retry 3 -o prev-index.json -w '%{http_code}' \
                   -H "Authorization: Bearer $TOKEN" \
                   -H "Accept: application/vnd.github.raw+json" \
                   "https://api.github.com/repos/farmer1st-common/fop-appstore/contents/manifests/index.json?ref=main")
          case "$code" in
            200) echo "RENDER_PREV=--prev-index prev-index.json" >> "$GITHUB_ENV"
                 echo "previous index fetched — versions will carry forward" ;;
            404) echo "::notice::no previous index in appstore yet (first publish)"
                 rm -f prev-index.json ;;
            *)   echo "::error::fetch of previous index failed with HTTP $code — refusing to publish with reset versions"
                 exit 1 ;;
          esac

      - name: Render manifests
        run: python3 render/render.py --out build ${RENDER_PREV:-}

      # The appstore's publish workflow downloads THIS run's artifact by the
      # exact name `staged` and expects a manifests/ tree at its root
      # (fop-appstore publish.yml step 4), then recomputes the PIN-4 tree hash
      # and rejects on mismatch. Artifact name, layout, and payload shape are
      # all contract — change only in lockstep with fop-appstore.
      - name: Stage manifests + compute PIN-4 tree hash
        id: stage
        run: |
          mkdir -p staged
          cp -R build/manifests staged/manifests
          echo "tree_sha256=$(python3 scripts/manifest_tree_sha256.py staged/manifests)" >> "$GITHUB_OUTPUT"

      - name: Upload staged manifests (the artifact the appstore verifies)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged
          path: staged/

      - name: Dispatch publish-manifests to fop-appstore
        env:
          TOKEN: ${{ secrets.APPSTORE_DISPATCH_TOKEN }}
          TREE_SHA256: ${{ steps.stage.outputs.tree_sha256 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::APPSTORE_DISPATCH_TOKEN not configured — render verified, dispatch skipped."
            exit 0
          fi
          # Payload = the appstore gate's closed publish-manifests schema
          # (schema/source_repo/source_ref/source_run_id/manifests_tree_sha256;
          # any extra or missing field is E_SCHEMA).
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({
              "event_type": "publish-manifests",
              "client_payload": {
                  "schema": 1,
                  "source_repo": os.environ["GITHUB_REPOSITORY"],
                  "source_ref": os.environ["GITHUB_SHA"],
                  "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "manifests_tree_sha256": os.environ["TREE_SHA256"],
              },
          }))
          PY
          )
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/farmer1st-common/fop-appstore/dispatches \
            -d "$payload"
          echo "dispatched publish-manifests: run=$GITHUB_RUN_ID tree=$TREE_SHA256"
