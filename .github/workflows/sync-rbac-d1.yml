# Sync resolved app-RBAC into the fop-rbac Cloudflare D1 database.
#
# Terraform creates the D1 database (terraform/d1.tf) but cannot write rows, so
# this job is the writer: it regenerates the SQL from the Profiles and applies it
# with `wrangler d1 execute`. Runs on merge to main whenever roles/apps change —
# consumer apps (leave-tracker) read the D1 read-only at runtime and never need
# to redeploy when a role changes.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   token with **D1: Edit** + Account: Read
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the fop-rbac D1
# Set D1_DATABASE_NAME below to the terraform output app_rbac_d1_database_name
# (default "fop-rbac").
name: sync-rbac-d1

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["profiles/**", "schema/**", "scripts/**", ".github/workflows/sync-rbac-d1.yml"]

permissions:
  contents: read

concurrency:
  group: rbac-d1-sync
  cancel-in-progress: false

env:
  D1_DATABASE_NAME: "fop-rbac"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt

      - name: Validate spec (fail-closed gate before we touch the DB)
        run: python3 scripts/validate.py validate

      - name: Generate the sync SQL
        run: python3 scripts/render-d1.py

      # Fail fast with a PRECISE reason if the token/account secrets are wrong,
      # instead of wrangler's generic "Authentication error [code: 10000]".
      - name: Preflight — verify Cloudflare token can do D1 on this account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || fail "Repo secret CLOUDFLARE_API_TOKEN is not set."
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || fail "Repo secret CLOUDFLARE_ACCOUNT_ID is not set."
          # Cloudflare has TWO token kinds that verify at DIFFERENT endpoints:
          # user tokens (My Profile) at /user/tokens/verify, account tokens
          # (cfat_..., created under the account) at /accounts/{id}/tokens/verify.
          # A valid account token gets "code 1000 Invalid API Token" from the
          # user endpoint — so accept either kind.
          ok=""
          for ep in "user/tokens/verify" "accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            v=$(curl -s "https://api.cloudflare.com/client/v4/$ep" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            if echo "$v" | grep -q '"status": *"active"'; then ok=yes; break; fi
          done
          [ -n "$ok" ] || fail "CLOUDFLARE_API_TOKEN is not an active user or account token (last verify response: $v)"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          [ "$code" = "200" ] || fail "Token cannot access D1 on account $CLOUDFLARE_ACCOUNT_ID (HTTP $code). Fix the token: Permissions = Account|D1|Edit, and Account Resources must INCLUDE this exact account."
          echo "Preflight OK — token active and can access D1 on the account."

      # Minimal wrangler config so the d1 commands resolve the account.
      - name: Write wrangler config
        run: |
          cat > wrangler.toml <<EOF
          name = "fop-rbac-sync"
          compatibility_date = "2026-01-01"
          EOF

      - name: Provision the D1 (create if missing) + sync the rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          # Create via the raw API (not wrangler) so a failure surfaces the FULL
          # Cloudflare error instead of a generic auth message.
          if curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?name=$D1_DATABASE_NAME&per_page=100" \
               | grep -q "\"name\": *\"$D1_DATABASE_NAME\""; then
            echo "D1 database $D1_DATABASE_NAME already exists."
          else
            echo "Creating D1 database $D1_DATABASE_NAME…"
            resp=$(curl -s -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$D1_DATABASE_NAME\"}")
            if ! echo "$resp" | grep -q '"success": *true'; then
              echo "::error::D1 create failed. Full API response: $resp"
              echo "::error::Auth error code 10000 here almost always means the token's D1 permission is READ — it must be EDIT (listing works with Read, creating does not)."
              exit 1
            fi
            echo "Created."
          fi
          echo "Applying schema + resolved rows…"
          npx --yes wrangler@4.111.0 d1 execute "$D1_DATABASE_NAME" --remote --yes --file build/rbac.sql
          echo "----- database id — bind this as FOP_RBAC_DB in leave-tracker -----"
          npx --yes wrangler@4.111.0 d1 info "$D1_DATABASE_NAME"
