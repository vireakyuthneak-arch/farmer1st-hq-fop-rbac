# Weekly catalog-token freshness check (+ on catalog PRs).
#
# Brew tokens rot silently — upstream renames (linear-linear -> linear happened
# to this catalog) or disables formulae, and the first symptom is a daemon's
# `brew bundle` failing on a fleet Mac. This job asks the Homebrew JSON API
# (never the brew binary, so it runs on cheap ubuntu) whether every catalog id
# still exists, and fails loudly if not. Fix = one-line catalog PR.
name: catalog-freshness

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (offset from top-of-hour load)
  workflow_dispatch: {}
  pull_request:
    paths: ["profiles/catalog.yml", "scripts/check-brew-tokens.py"]

permissions:
  contents: read

concurrency:
  group: catalog-freshness-${{ github.ref }}
  cancel-in-progress: true # read-only check; superseded runs are worthless

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt
      - name: Download Homebrew API indexes (retried; ~30 MB total)
        run: |
          mkdir -p /tmp/brew-api
          curl -sSf --retry 3 --retry-delay 10 -o /tmp/brew-api/formula.json \
            https://formulae.brew.sh/api/formula.json
          curl -sSf --retry 3 --retry-delay 10 -o /tmp/brew-api/cask.json \
            https://formulae.brew.sh/api/cask.json
      - name: Check every catalog token against upstream
        run: python3 scripts/check-brew-tokens.py --api-dir /tmp/brew-api
