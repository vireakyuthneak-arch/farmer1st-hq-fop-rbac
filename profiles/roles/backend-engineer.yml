# Backend Engineer
schemaVersion: 1
role: backend-engineer
description: Application services, APIs, and the data layer.

apps:
  # everyday
  - vscode
  - slack
  - granola
  # dev
  - git
  - gh
  - python
  - node
  - docker
  - docker-compose
  # data + API
  - postgresql
  - dbeaver
  - tableplus
  - postman
  - insomnia
  # from team app list 2026-07-14 (not installable via brew, handled elsewhere:
  # Notes/Terminal = macOS native; Amphetamine/Xcode = App Store -> MDM/VPP;
  # Chrome extension, Claude Code URL Handler, ohMyZsh = not brew; Plane = web app)
  - chrome
  - claude-desktop
  - claude-code
  - codex
  - chatgpt
  - iterm2
  - obsidian
  - privileges
  - pycharm
  - zen
  - nvm
  - node-22
  - fnm
  - uv
  - wrangler
  - mlx
  - ollama
  - spotify

# trust-plane installs (admin-requiring; daemon root plane handles these)
system:
  - docker-desktop

# per-app roles (see profiles/applications.yml; strongest wins across roles)
# NOTE: additive only — the Abra renderer ignores this key entirely
appRoles:
  roadmap: viewer
  slack: member

cloud:
  aws:
    # Developer persona: write in the throwaway sandbox, read-only in the shared
    # pipeline-deployed environments, nothing in production.
    grants:
      - account: sandbox
        permissionSet: PowerUser
      - account: sit
        permissionSet: ViewOnly
      - account: staging
        permissionSet: ViewOnly
  github:
    org: farmer1st-hq
    teams:
      - backend
  cloudflare:
    accessGroups:
      - internal-dashboards
